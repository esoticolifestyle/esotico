<script id="esotico-header-now">
/* Header links visible at once (3 Oct 2026). Squarespace's site animations keep the header elements it tags
   data-animation-role="header-element" (the BRANDS and HELP folder titles, the LOGIN link) at opacity 0 until its
   animation code runs, which waits behind the rest of the page: on the live site LOGIN and HELP showed seconds after
   SHOP, GIFTS and ABOUT (owner, Edge and Chrome). This shows them with the rest of the header. */
(function () {
  var s = document.createElement('style');
  s.textContent = '.header-display-desktop [data-animation-role="header-element"],.header-display-mobile [data-animation-role="header-element"]{opacity:1!important;transform:none!important;transition:none!important}' +
    /* The login link ships with both words; Squarespace removes the one that does not apply only at full page load.
       Until then show "Login" alone: once "Login" is removed (signed in), "Account" shows. */
    '.user-accounts-text-link .unauth + .auth{display:none!important}' +
    /* Seven menu items since the Journal (4 Oct 2026): between 768 and 1100 px wide the last one (HELP) wrapped to a
       second line at 880 px. There the letters sit a little closer and a little smaller, on one line. */
    /* The Gift Edit's large ring is drawn on every ink section of that page (esotico-brand.css), the footer included;
       the footer does not clip it, so it hung 230 px below the page as a gold arc on an empty cream band (owner,
       4 Oct 2026). The ring belongs to the page's own section only. */
    'footer .page-section::before{content:none!important}' +
    /* Speed test, 4 Oct 2026: the keyboard "Skip to Content" link was the only text in Squarespace's theme serif
       (Newsreader), so every visit downloaded that 52 KB font for a link shown only on Tab. It takes the site's sans. */
    '.header-skip-link{font-family:"Josefin Sans","Helvetica Neue",Arial,sans-serif!important}' +
    /* The Gift Edit grew a corporate gifts band (4 Oct 2026); with the ring centred at half the taller section it ran
       across the "Give a gift card" button. A third of the way down keeps it where it sat before, behind the tiles
       and the gift card. */
    '.collection-6abb47853128147833a522c3 main section[data-section-theme="black"]::before{top:33%!important}' +
    '@media (min-width:768px) and (max-width:1100px){.header-display-desktop .header-nav-item>a,.header-display-desktop .header-nav-folder-title{letter-spacing:.16em!important;font-size:11px!important}.header-display-desktop .header-nav-list{flex-wrap:nowrap}}';
  document.head.appendChild(s);
  /* Squarespace connects the login click only at full page load; a click before that went nowhere. Until its
     link is marked "loaded", send the click to /account (it opens the sign-in window, or the account when signed in). */
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('.user-accounts-text-link') : null;
    if (!a) return;
    var wrap = a.closest('.user-accounts-link');
    if (wrap && wrap.classList.contains('loaded')) return;
    e.preventDefault();
    window.location.href = '/account';
  }, true);
})();
</script>
