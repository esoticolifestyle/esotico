<!doctype html>
<!-- Classic Outlook dark-mode probe 2 (29 Sep 2026). Probe 1 (owner's screenshot, dark mode): only ivory text with an

     grey read well. Word (same engine, light) paints mso-color-alt as the colour itself, so line F would vanish in

     sun button (light background). Mid-tones are the fallback that reads in both. -->
